<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>
    <div class="container">
        <div class="left">
          <img src="https://undraw.co/api/illustrations/7b0f6483-d1da-4a59-b660-27b6a283c660" alt="Illustration" />
          <p>A problem well stated<br> is a problem <span>half solved</span></p>
        </div>
        <div class="right">
          <div class="top-text">
            Already a user?
            <a href="#">Sign in</a>
          </div>
          <h2>Sign up</h2>
          <form>
            <input type="text" placeholder="Full name" required />
            <input type="email" placeholder="Email Address" required />
            <div class="password-group">
              <input type="password" placeholder="Password" required />
              <span class="show-placeholder">Show</span>
            </div>
            <input type="password" placeholder="Confirm Password" required />
            <button>Create Account</button>
          </form>
          <p class="note">
            By signing up, you agree to our terms, conditions and data usage policies. You can unsubscribe at any time.
          </p>
        </div>
      </div>
</body>
</html>
