<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Color Example</title>
</head>
<body>

  <button id="colorBtn">Change Color</button>
  <p id="para">Some text</p>

  <script>
    document.getElementById("colorBtn").onclick = function() {
      document.getElementById("para").style.color = "red";
    };
  </script>

</body>
</html>
