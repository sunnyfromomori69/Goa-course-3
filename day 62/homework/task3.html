<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Size Example</title>
</head>
<body>

  <button id="sizeBtn">Change Size</button>
  <h1 id="title">Welcome</h1>
  <script>
    document.getElementById("sizeBtn").onclick = function() {
      document.getElementById("title").style.fontSize = "40px";
    };
  </script>
</body>
</html>
